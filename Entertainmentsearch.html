<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IMDb Finder</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#111827;
        color:white;
        padding:30px;
    }

    .container{
        max-width:1200px;
        margin:auto;
    }

    h1{
        text-align:center;
        margin-bottom:25px;
        color:#f5c518;
    }

    .search-box{
        background:#1f2937;
        padding:20px;
        border-radius:12px;
        margin-bottom:30px;
    }

    .grid{
        display:grid;
        grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
        gap:20px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
    }

    input, select{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        outline:none;
    }

    button{
        margin-top:25px;
        width:100%;
        padding:14px;
        border:none;
        border-radius:8px;
        background:#f5c518;
        color:black;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        opacity:0.9;
    }

    button:disabled{
        opacity:0.5;
        cursor:not-allowed;
    }

    .loading{
        text-align:center;
        padding:20px;
        color:#f5c518;
    }

    .error{
        background:#7f1d1d;
        color:#fecaca;
        padding:15px;
        border-radius:8px;
        margin:10px 0;
    }

    .results{
        display:grid;
        grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
        gap:20px;
    }

    .card{
        background:#1f2937;
        padding:20px;
        border-radius:12px;
        border:1px solid #374151;
    }

    .poster{
        width:100%;
        height:300px;
        object-fit:cover;
        border-radius:8px;
        margin-bottom:15px;
    }

    .card h2{
        color:#f5c518;
        margin-bottom:10px;
    }

    .rating{
        background:#374151;
        display:inline-block;
        padding:8px 12px;
        border-radius:6px;
        margin:10px 0;
        font-weight:bold;
    }

    .badge{
        display:inline-block;
        padding:6px 12px;
        background:#374151;
        border-radius:20px;
        margin:5px 5px 0 0;
        font-size:14px;
    }

    .seen{
        margin-top:15px;
    }

    .seen label{
        display:flex;
        align-items:center;
        gap:10px;
        font-weight:normal;
    }

    .imdb-link{
        margin-top:15px;
        display:inline-block;
        color:#60a5fa;
        text-decoration:none;
    }

    .imdb-link:hover{
        text-decoration:underline;
    }

    .api-key-section{
        background:#1f2937;
        padding:15px;
        border-radius:8px;
        margin-bottom:20px;
        border:1px solid #374151;
    }

    .api-key-section input{
        width:100%;
    }

    .api-key-section a{
        color:#60a5fa;
    }

    .plot{
        margin:10px 0;
        font-size:14px;
        line-height:1.5;
        color:#d1d5db;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🎬 IMDb Movie & Series Finder</h1>

    <div class="api-key-section">
        <label>OMDB API Key (Get free key at <a href="https://www.omdbapi.com/" target="_blank">omdbapi.com</a>)</label>
        <input type="password" id="apiKey" placeholder="Enter your OMDB API key">
    </div>

    <div class="search-box">

        <div class="grid">

            <div>
                <label>Search Title</label>
                <input type="text" id="searchTitle" placeholder="Enter movie or series name">
            </div>

            <div>
                <label>Type</label>
                <select id="type">
                    <option value="">All</option>
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                </select>
            </div>

            <div>
                <label>Year</label>
                <input type="number" id="year" placeholder="e.g., 2020">
            </div>

        </div>

        <button onclick="searchShows()" id="searchBtn">Search</button>

    </div>

    <div class="results" id="results"></div>

</div>

<script>

async function searchShows(){
    const apiKey = document.getElementById("apiKey").value;
    const searchTitle = document.getElementById("searchTitle").value;
    const type = document.getElementById("type").value;
    const year = document.getElementById("year").value;
    const resultsDiv = document.getElementById("results");
    const searchBtn = document.getElementById("searchBtn");

    if(!apiKey){
        resultsDiv.innerHTML = '<div class="error">Please enter your OMDB API key first.</div>';
        return;
    }

    if(!searchTitle){
        resultsDiv.innerHTML = '<div class="error">Please enter a search title.</div>';
        return;
    }

    searchBtn.disabled = true;
    resultsDiv.innerHTML = '<div class="loading">Searching...</div>';

    try {
        let url = `https://www.omdbapi.com/?apikey=${apiKey}&s=${encodeURIComponent(searchTitle)}`;
        
        if(type){
            url += `&type=${type}`;
        }

        if(year){
            url += `&y=${year}`;
        }

        const response = await fetch(url);
        const data = await response.json();

        if(data.Response === "False"){
            resultsDiv.innerHTML = `<div class="error">No results found. ${data.Error}</div>`;
            searchBtn.disabled = false;
            return;
        }

        resultsDiv.innerHTML = "";

        for(const result of data.Search){
            const detailsResponse = await fetch(`https://www.omdbapi.com/?apikey=${apiKey}&i=${result.imdbID}`);
            const details = await detailsResponse.json();

            const card = document.createElement("div");
            card.className = "card";

            const posterUrl = details.Poster !== "N/A" ? details.Poster : "https://via.placeholder.com/300x450?text=No+Poster";
            const plot = details.Plot !== "N/A" ? details.Plot : "No plot available";
            const rating = details.imdbRating !== "N/A" ? `⭐ ${details.imdbRating}/10` : "No rating";
            const genres = details.Genre !== "N/A" ? details.Genre : "N/A";
            const released = details.Released !== "N/A" ? details.Released : "N/A";

            card.innerHTML = `
                <img src="${posterUrl}" alt="${details.Title}" class="poster" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
                <h2>${details.Title}</h2>
                
                <p><strong>Type:</strong> ${details.Type}</p>
                <p><strong>Released:</strong> ${released}</p>
                <p><strong>Genre:</strong> ${genres}</p>
                
                <div class="rating">${rating}</div>
                
                <div class="plot">
                    <strong>Plot:</strong><br>
                    ${plot}
                </div>

                <div class="streaming">
                    <strong>Details:</strong><br>
                    <span class="badge">Runtime: ${details.Runtime}</span>
                    <span class="badge">Director: ${details.Director !== "N/A" ? details.Director : "N/A"}</span>
                </div>

                <div class="seen">
                    <label>
                        <input type="checkbox">
                        Already Seen
                    </label>
                </div>

                <a class="imdb-link" href="https://www.imdb.com/title/${details.imdbID}/" target="_blank">
                    Open IMDb Page
                </a>
            `;

            resultsDiv.appendChild(card);
        }

    } catch(error){
        resultsDiv.innerHTML = `<div class="error">Error fetching data: ${error.message}</div>`;
    }

    searchBtn.disabled = false;
}

// Allow Enter key to search
document.getElementById("searchTitle").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        searchShows();
    }
});

</script>

</body>
</html>
